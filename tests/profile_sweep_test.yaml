cluster:
  user: 'ubuntu'
  tmp_dir: /home/ubuntu/tmp_stats_sweep_test/
  head: '10.19.4.10'
  clients: ['10.19.4.10', '10.19.4.11', '10.19.4.12', '10.19.4.13', '10.19.4.14', '10.19.4.15']
  osds: ['10.19.4.10', '10.19.4.11', '10.19.4.12', '10.19.4.13', '10.19.4.14', '10.19.4.15']
  mons: ['10.19.4.10', '10.19.4.11', '10.19.4.12', '10.19.4.13', '10.19.4.14', '10.19.4.15']
  use_existing: True
  rebuild_every_test: False
  iterations: 1
  pool_profiles:
    rbd_nvme:
      pg_size: 1024
      pgp_size: 1024
      replication: 3

# =========================================================
# MONITORING PROFILES with perf profiliing (for flame graphs)
# =========================================================
monitoring_profiles:
  collectl:
    args: '-sCDN -i 5 --rawdskfilt "+nvme[0-9]n[0-9]+" -P -oD -f {collectl_dir}'
  
  perf:
    args: 'record -g -a -F 99'

benchmarks:
  librbdfio:
    poolname: 'rbd'
    time: 300
    ramp: 30
    volumes_per_client: [8]
    procs_per_client: [1]
    vol_size: 51200
    pool_profile: "rbd_nvme"
    log_avg_msec: 1000
    log_iops: True
    log_bw: True
    log_lat: True
    fio_out_format: "json"

    prefill:
      enabled: True
      blocksize: "4M"
      numjobs: 8

    workloads:
      # =========================================================
      # PHASE 1: LATENCY FLOOR (Baseline)
      # =========================================================
      phase1_randwrite_4k_baseline:
        jobname: "1_Latency_Baseline_RandWrite_4KB"
        mode: "randwrite"
        op_size: 4096
        iodepth: [1]
        numjobs: [1]
      phase1_randread_4k_baseline:
        jobname: "1_Latency_Baseline_RandRead_4KB"
        mode: "randread"
        op_size: 4096
        iodepth: [1]
        numjobs: [1]
      phase1_randwrite_8k_baseline:
        jobname: "1_Latency_Baseline_RandWrite_8KB"
        mode: "randwrite"
        op_size: 8192
        iodepth: [1]
        numjobs: [1]
      phase1_randread_8k_baseline:
        jobname: "1_Latency_Baseline_RandRead_8KB"
        mode: "randread"
        op_size: 8192
        iodepth: [1]
        numjobs: [1]

      # =========================================================
      # PHASE 2: LIGHT LOAD (Mixed Use)
      # =========================================================
      phase2_randwrite_4k:
        jobname: "2_Light_RandWrite_4KB"
        mode: "randwrite"
        op_size: 4096
        iodepth: [4, 8, 16]
        numjobs: [1, 4]

      phase2_randread_4k:
        jobname: "2_Light_RandRead_4KB"
        mode: "randread"
        op_size: 4096
        iodepth: [4, 8, 16]
        numjobs: [1, 4]

      phase2_randwrite_16k:
        jobname: "2_Light_RandWrite_16KB"
        mode: "randwrite"
        op_size: 16384
        iodepth: [4, 8, 16]
        numjobs: [1, 4]

      phase2_randread_16k:
        jobname: "2_Light_RandRead_16KB"
        mode: "randread"
        op_size: 16384
        iodepth: [4, 8, 16]
        numjobs: [1, 4]

      # =========================================================
      # PHASE 3: HEAVY IOPS
      # =========================================================
      phase3_randwrite_4k:
        jobname: "3_HeavyIOPS_RandWrite_4KB"
        mode: "randwrite"
        op_size: 4096
        iodepth: [64, 128, 256]
        numjobs: [8, 16]

      phase3_randread_4k:
        jobname: "3_HeavyIOPS_RandRead_4KB"
        mode: "randread"
        op_size: 4096
        iodepth: [64, 128, 256]
        numjobs: [8, 16]

      # =========================================================
      # PHASE 4: HEAVY BANDWIDTH (Sequential)
      # =========================================================
      phase4_seqwrite_4M:
        jobname: "4_HeavyBW_SeqWrite_4MB"
        mode: "write"
        op_size: 4194304
        iodepth: [32, 64, 128]
        numjobs: [4, 8]

      phase4_seqread_4M:
        jobname: "4_HeavyBW_SeqRead_4MB"
        mode: "read"
        op_size: 4194304
        iodepth: [32, 64, 128]
        numjobs: [4, 8]