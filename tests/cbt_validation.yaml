cluster:
  user: 'ubuntu'
  tmp_dir: /home/ubuntu/cbt_validation/
  head: '10.19.4.10'
  clients: ['10.19.4.10', '10.19.4.11', '10.19.4.12', '10.19.4.13', '10.19.4.14', '10.19.4.15']
  osds: ['10.19.4.10', '10.19.4.11', '10.19.4.12', '10.19.4.13', '10.19.4.14', '10.19.4.15']
  mons: ['10.19.4.10', '10.19.4.11', '10.19.4.12', '10.19.4.13', '10.19.4.14', '10.19.4.15']
  use_existing: True
  rebuild_every_test: False
  iterations: 1
  pool_profiles:
    validation:
      pg_size: 8
      pgp_size: 8

benchmarks:
  librbdfio:
    time: 30                # Run for only 30 seconds
    vol_size: 1024          # Create a tiny 1GB RBD image
    mode: ['write', 'randwrite']     # Test random writes
    op_size: [4096]         # 4KB block size
    iodepth: [1]            # Queue depth 1
    procs_per_node: 1       # 1 FIO process per client
    pool_profile: 'validation'
    log_avg_msec: 1000
 
  radosbench:
    time: 30
    op_size: [4096]
    write_only: True
    concurrent_procs: 1
    concurrent_ops: [1]
    pool_profile: 'validation'

